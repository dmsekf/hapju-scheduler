<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b90e2" />
    <title>합주 스케줄러</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
:root {
  --bg: #f4f8ff;
  --paper: #ffffff;
  --ink: #243044;
  --muted: #5d6f86;
  --line: #d5e4f4;
  --navy: #4b90e2;
  --navy-2: #3b7ed0;
  --coral: #ff7a72;
  --coral-soft: #ffe4e1;
  --ok: #3da87a;
  --header-fg: #ffffff;
  --grid-head: #eaf3ff;
  --grid-time: #f3f8ff;
  --shadow: 0 8px 24px rgba(75, 144, 226, 0.12);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
}

body {
  padding-bottom: var(--safe-bottom);
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden,
[hidden] {
  display: none !important;
}

.topbar,
.schedule-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: var(--navy);
  color: var(--header-fg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border: 2px solid var(--header-fg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.logo-mark i {
  border: 1px solid rgba(247, 241, 232, 0.4);
}

.logo-mark i:nth-child(1),
.logo-mark i:nth-child(4) {
  background: var(--coral);
}

.icon-btn,
.text-btn,
.primary,
.ghost {
  border: 0;
  border-radius: 10px;
  min-height: 44px;
}

.icon-btn,
.ghost {
  background: rgba(255, 255, 255, 0.08);
  color: inherit;
  padding: 0 12px;
}

.text-btn {
  background: transparent;
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.primary {
  background: var(--navy);
  color: #fff;
  padding: 0 18px;
  font-weight: 700;
}

.primary:disabled {
  opacity: 0.6;
}

.ghost.light {
  background: #e8f2ff;
  color: var(--ink);
}

.select-wrap {
  min-height: calc(100dvh - 56px);
  display: grid;
  place-items: start center;
  padding: 28px 16px 40px;
}

.card {
  width: min(560px, 100%);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 22px;
  box-shadow: var(--shadow);
}

.card h1 {
  margin: 0 0 8px;
  font-size: 1.6rem;
}

.lead {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 0.95rem;
}

.member-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: min(46vh, 420px);
  overflow: auto;
  padding-right: 2px;
}

.member-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-weight: 600;
  font-size: 0.92rem;
}

.member-btn small {
  font-weight: 500;
  color: var(--muted);
}

.member-btn.is-last,
.member-btn:hover {
  border-color: var(--navy);
}

.resume-btn {
  width: 100%;
  margin-bottom: 14px;
  background: var(--navy);
  color: #fff;
  border: 0;
  border-radius: 12px;
  min-height: 48px;
  font-weight: 700;
}

.connect-status,
.empty-hint {
  color: var(--muted);
  font-size: 0.88rem;
}

.settings-toggle {
  margin-top: 18px;
  background: none;
  border: 0;
  color: var(--muted);
  text-decoration: underline;
  padding: 0;
}

.settings-panel {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.settings-panel input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  background: #fff;
}

.who {
  min-width: 0;
}

.who strong {
  display: block;
  font-size: 1.05rem;
}

.who p {
  margin: 2px 0 0;
  font-size: 0.75rem;
  opacity: 0.8;
}

.week-bar {
  position: sticky;
  top: 56px;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg);
}

.week-bar strong {
  font-size: 0.95rem;
}

.layout {
  display: grid;
  gap: 16px;
  padding: 0 16px 96px;
}

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 1rem;
}

.day-chips {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}

.day-chip {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 58px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 6px 0;
}

.day-chip span {
  font-size: 0.72rem;
  color: var(--muted);
}

.day-chip strong {
  font-size: 1rem;
}

.day-chip em {
  font-style: normal;
  font-size: 0.68rem;
  color: var(--coral);
}

.day-chip.is-active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.day-chip.is-active span,
.day-chip.is-active em {
  color: #f8d7d4;
}

.day-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.day-actions button {
  flex: 1;
}

.hour-list {
  display: grid;
  gap: 8px;
  user-select: none;
}

.hour-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.hour-btn b {
  font-weight: 600;
  color: var(--ok);
  font-size: 0.82rem;
}

.hour-btn.is-off,
td.is-off {
  background: var(--coral);
  color: #fff;
  border-color: #f06a62;
}

.hour-btn.is-off b {
  color: #fff;
}

.grid-hint {
  margin: 0 0 10px;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.45;
}

.grid-wrap {
  overflow: visible;
  max-height: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  user-select: none;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
}

th,
td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
  height: 36px;
}

td {
  touch-action: manipulation;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--grid-head);
  font-size: 0.82rem;
}

tbody th {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 64px;
  background: var(--grid-time);
  font-size: 0.78rem;
  color: var(--muted);
}

thead th:first-child {
  left: 0;
  z-index: 4;
}

thead th span {
  display: block;
  color: var(--muted);
  font-weight: 500;
  font-size: 0.72rem;
}

td {
  background: #fff;
  cursor: pointer;
}

.reason-row {
  display: grid;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.reason-meta {
  display: grid;
}

.reason-meta small {
  color: var(--muted);
}

.reason-row input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
}

.save-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 72px;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 16px;
  background: var(--paper);
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(75, 144, 226, 0.12);
}

.save-bar .primary {
  min-width: 0;
  flex: 1;
  min-height: 48px;
}

.sync-label {
  font-size: 0.8rem;
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(148px + var(--safe-bottom));
  transform: translateX(-50%) translateY(12px);
  background: var(--navy-2);
  color: #fff;
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
  z-index: 40;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.warn {
  background: #8a3b34;
}

@media (min-width: 900px) {
  .layout {
    grid-template-columns: 1.4fr 0.8fr;
    padding-bottom: 32px;
  }

  .grid-hint {
    display: none;
  }

  .grid-wrap {
    overflow: auto;
    max-height: min(68vh, 720px);
  }

  th,
  td {
    height: 40px;
  }

  .save-bar {
    position: static;
    border: 0;
    padding: 12px 0 0;
    background: transparent;
    box-shadow: none;
  }

  .save-bar .primary {
    flex: none;
    min-width: 120px;
    min-height: 44px;
  }

  .schedule-header .primary {
    min-width: 96px;
  }

  .header-save {
    display: block;
  }
}

@media (max-width: 899px) {
  .schedule-header .header-save {
    display: block;
    min-width: 72px;
    flex-shrink: 0;
  }

  .layout {
    padding: 0 10px 168px;
  }

  .schedule-header {
    padding: 10px 12px;
  }

  .week-bar {
    top: 52px;
    padding: 8px 10px;
  }

  .grid-wrap {
    overflow: visible;
    max-height: none;
  }

  thead th,
  tbody th,
  thead th:first-child {
    position: static;
  }

  .panel {
    padding: 12px 10px;
  }

  table {
    min-width: 0;
    table-layout: fixed;
  }

  tbody th,
  thead th:first-child {
    width: 42px;
    font-size: 0.68rem;
    padding: 0 2px;
  }

  thead th {
    font-size: 0.68rem;
    padding: 4px 1px;
  }

  thead th span {
    font-size: 0.62rem;
  }

  td {
    height: 34px;
  }
}

.search-row {
  margin-bottom: 10px;
}

.search-row input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  background: #fff;
}

.chosung-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.chip,
.admin-tabs button {
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
  font-size: 0.82rem;
}

.chip.is-on,
.admin-tabs button.is-on {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.member-count {
  margin: 8px 0 0;
  font-size: 0.8rem;
  color: var(--muted);
}

.admin-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.admin-gate {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.admin-page {
  padding: 0 16px 28px;
}

.admin-tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
}

.heat-cell {
  cursor: pointer;
  font-weight: 700;
  font-size: 0.82rem;
}

.heat-good {
  background: #d7efe0;
}

.heat-ok {
  background: #f4e7c3;
}

.heat-bad {
  background: #f4d0cc;
}

.status-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.status-row .ok {
  color: var(--ok);
  font-size: 0.85rem;
}

.status-row .wait {
  color: var(--coral);
  font-size: 0.85rem;
}

#admin-roster {
  width: 100%;
  min-height: 220px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font: inherit;
}

.admin-detail {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.detail-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-cols h3 {
  margin: 0 0 6px;
  font-size: 0.85rem;
}

.admin-badge {
  font-size: 0.75rem;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

.menu-split {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0 16px;
}

.subhead {
  font-size: 1rem;
  margin: 0 0 10px;
}

.menu-actions {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}

.menu-actions .primary,
.menu-actions .ghost.light {
  width: 100%;
}

.upload-box {
  text-align: center;
}

.upload-box .warn {
  color: var(--coral);
  font-weight: 700;
}

.file-btn {
  display: inline-block;
  margin-top: 12px;
}

.song-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 16px 12px;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
}

.filter-bar input[type="date"] {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 8px;
}

.need-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin: 8px 0 16px;
}

.need-label {
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 700;
}

.tag {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
}

.tag-vocal {
  background: #eee4fb;
  color: #5b2d91;
  border-color: #d8c6f3;
}

.tag-ok {
  background: #fff;
  color: var(--ink);
}

.tag-miss {
  background: #fde8e6;
  color: #9b2c22;
  border-color: #f3c4be;
}

.result-cols {
  display: grid;
  gap: 16px;
}

.full-title {
  color: #1f7a4d;
}

.inst-title {
  color: #5b2d91;
}

.slot-scroll {
  max-height: 500px;
  overflow: auto;
  display: grid;
  gap: 10px;
}

.slot-card {
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
}

.slot-card.emerald .slot-date {
  background: #d9f3e4;
  color: #145c38;
}

.slot-card.purple .slot-date {
  background: #eee4fb;
  color: #5b2d91;
}

.slot-date {
  padding: 8px 12px;
  font-weight: 700;
  font-size: 0.9rem;
}

.slot-times {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  background: #fff;
}

.slot-times span {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 0.82rem;
  font-weight: 700;
}

.empty-slot {
  text-align: center;
  color: var(--muted);
  padding: 28px 12px;
  border: 1px dashed var(--line);
  border-radius: 12px;
}

@media (min-width: 900px) {
  .result-cols {
    grid-template-columns: 1fr 1fr;
  }
}

</style>
  </head>
  <body>
    <div id="view-select">
      <header class="topbar">
        <div class="brand">
          <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="app-title">합주 스케줄러</span>
        </div>
        <button type="button" id="btn-admin" class="ghost">관리자</button>
      </header>
      <main class="select-wrap">
        <section class="card" id="select-card">
          <h1 id="select-title">합주 스케줄러</h1>
          <p class="lead">본인 이름을 찾은 뒤, 안 되는 시간만 칠하면 됩니다.</p>
          <button type="button" id="quick-resume" class="resume-btn" hidden>
            <span id="quick-resume-name"></span> (이어서 입력)
          </button>
          <div class="search-row">
            <input id="member-search" type="search" placeholder="이름 또는 초성 검색" autocomplete="off" />
          </div>
          <div id="chosung-chips" class="chosung-chips"></div>
          <div id="member-list" class="member-list"></div>
          <p id="member-count" class="member-count"></p>
          <p id="connect-status" class="connect-status"></p>
        </section>
      </main>
    </div>

    <div id="view-schedule" hidden>
      <header class="schedule-header">
        <button type="button" id="btn-back" class="ghost">바꾸기</button>
        <div class="who">
          <strong id="header-name"></strong>
          <p>안 되는 시간을 칠하세요. 칸을 누르면 선택됩니다.</p>
        </div>
        <button type="button" id="save-btn" class="primary header-save">저장</button>
      </header>
      <div class="week-bar">
        <button type="button" id="week-prev" class="ghost light">◀</button>
        <strong id="week-label"></strong>
        <button type="button" id="week-next" class="ghost light">▶</button>
      </div>
      <main class="layout">
        <section class="panel">
          <h2>주간 시간표</h2>
          <p class="grid-hint">칸을 눌러 안 되는 시간을 칠하세요. 화면을 위아래로 스크롤할 수 있습니다.</p>
          <div id="day-chips" class="day-chips" hidden></div>
          <div id="hour-list" class="hour-list" hidden></div>
          <div class="grid-wrap">
            <table id="schedule-grid">
              <thead id="grid-head"></thead>
              <tbody id="grid-body"></tbody>
            </table>
          </div>
        </section>
        <section class="panel">
          <h2>불가능한 사유</h2>
          <div id="reason-list"></div>
          <div class="save-bar">
            <span class="sync-label">안 되는 시간만 저장됩니다.</span>
            <button type="button" id="save-btn-bar" class="primary">저장</button>
          </div>
        </section>
      </main>
    </div>

    <div id="view-done" hidden>
      <main class="select-wrap">
        <section class="card">
          <h1>저장 완료</h1>
          <p class="lead"><strong id="done-name"></strong> 님 스케줄이 저장되었습니다. 이 창을 닫아도 됩니다.</p>
          <p><button type="button" id="btn-close-window" class="primary" style="width:100%">창 닫기</button></p>
          <p id="close-hint" class="empty-hint" hidden>브라우저에서 이 탭의 X를 눌러 닫아 주세요.</p>
          <p><button type="button" id="btn-done-again" class="settings-toggle">다른 이름으로 다시 입력</button></p>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    
    
    
    
    
  <script>
window.HAPJU_CONFIG = {
  title: "합주 스케줄러",
  fallbackMembers: ["김민지", "팜하니", "다니엘", "해린", "혜인"],
  startHour: 10,
  endHour: 23,
  storagePrefix: "hapju-scheduler.v1.",
  adminPin: "1234",
};

(function (global) {
  var prefix = (global.HAPJU_CONFIG && global.HAPJU_CONFIG.storagePrefix) || "hapju.";

  function key(name) {

    var userUnavail = db.unavailabilities[user] || {};
    Object.keys(userUnavail).forEach(function (key) {
      state.uiUnavailabilities[key] = true;
      var dateStr = key.split("_")[0];
      if (userUnavail[key]) state.uiReasons[dateStr] = userUnavail[key];
    });
    var draft = HapjuStorage.getDraft(user);
    if (draft && draft.uiUnavailabilities) {
      state.uiUnavailabilities = draft.uiUnavailabilities;
      state.uiReasons = draft.uiReasons || {};
      if (draft.monday) {
        var p = draft.monday.split("-");
        state.monday = getMonday(new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12, 0, 0));
      }
      if (typeof draft.selectedDayIndex === "number") state.selectedDayIndex = draft.selectedDayIndex;
    }
    $("header-name").textContent = user;
    renderSchedule();
    showView("schedule");
  }

  function fillDay(value) {
    var dateStr = formatDateStr(weekDates()[state.selectedDayIndex]);
    for (var h = START; h <= END; h++) applyCell(dateStr, h, value);
    persistDraft();
    renderDayChips();
    renderGrid();
    renderReasons();
  }

  function onPaintStart(ev) {
    var cell = ev.target.closest("[data-date][data-hour]");
    if (!cell) return;
    if (ev.pointerType === "mouse" && ev.button !== 0) return;
    var dateStr = cell.getAttribute("data-date");
    var hour = Number(cell.getAttribute("data-hour"));
    var next = !state.uiUnavailabilities[cellKey(dateStr, hour)];
    if (ev.pointerType === "touch") {
      applyCell(dateStr, hour, next);
      persistDraft();
      renderReasons();
      return;
    }
    ev.preventDefault();
    state.paint = { value: next };
    applyCell(dateStr, hour, next);
    try {
      ev.currentTarget.setPointerCapture(ev.pointerId);
    } catch (e) {}
  }

  function onPaintMove(ev) {
    if (!state.paint) return;
    var el = document.elementFromPoint(ev.clientX, ev.clientY);
    var cell = el && el.closest("[data-date][data-hour]");
    if (!cell) return;
    applyCell(cell.getAttribute("data-date"), Number(cell.getAttribute("data-hour")), state.paint.value);
  }

  function onPaintEnd() {
    if (!state.paint) return;
    state.paint = null;
    persistDraft();
    renderDayChips();
    renderReasons();
    renderHourList();
  }

  function bindPaint(el) {
    el.addEventListener("pointerdown", onPaintStart);
    el.addEventListener("pointermove", onPaintMove);
    el.addEventListener("pointerup", onPaintEnd);
    el.addEventListener("pointercancel", onPaintEnd);
  }

  function collectUserUnavail() {
    var out = {};
    Object.keys(state.uiUnavailabilities).forEach(function (key) {
      if (!state.uiUnavailabilities[key]) return;
      out[key] = state.uiReasons[key.split("_")[0]] || "";
    });
    return out;
  }

  function saveSchedule() {
    var btns = [$("save-btn"), $("save-btn-bar")];
    persistDraft();
    btns.forEach(function (btn) {
      if (!btn) return;
      btn.disabled = true;
      btn.textContent = "저장 중…";
    });
    HapjuSync.saveUser(state.currentUser, collectUserUnavail())
      .then(function () {
        $("done-name").textContent = state.currentUser;
        showView("done");
      })
      .catch(function () {
        showToast("저장에 실패했습니다. 다시 눌러 주세요.", "warn");
        btns.forEach(function (btn) {
          if (!btn) return;
          btn.disabled = false;
          btn.textContent = "저장";
        });
      });
  }

  function openAdmin() {
    window.location.href = "admin.html";
  }

  document.addEventListener("DOMContentLoaded", function () {
    $("app-title").textContent = cfg.title;
    $("select-title").textContent = cfg.title;
    $("member-list").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-member]");
      if (btn) startInput(btn.getAttribute("data-member"));
    });
    $("quick-resume").addEventListener("click", function () {
      startInput(HapjuStorage.getUser());
    });
    $("btn-back").addEventListener("click", function () {
      showView("select");
    });
    $("btn-admin").addEventListener("click", openAdmin);
    $("week-prev").addEventListener("click", function () {
      state.monday = addDays(state.monday, -7);
      persistDraft();
      renderSchedule();
    });
    $("week-next").addEventListener("click", function () {
      state.monday = addDays(state.monday, 7);
      persistDraft();
      renderSchedule();
    });
    $("day-chips").addEventListener("click", function (ev) {
      var chip = ev.target.closest("[data-day-index]");
      if (!chip) return;
      state.selectedDayIndex = Number(chip.getAttribute("data-day-index"));
      persistDraft();
      renderDayChips();
      renderHourList();
    });
    bindPaint($("hour-list"));
    bindPaint($("schedule-grid"));
    $("reason-list").addEventListener("input", function (ev) {
      var input = ev.target.closest("[data-reason-date]");
      if (!input) return;
      state.uiReasons[input.getAttribute("data-reason-date")] = input.value;
      persistDraft();
    });
    $("save-btn").addEventListener("click", saveSchedule);
    $("save-btn-bar").addEventListener("click", saveSchedule);
    $("btn-close-window").addEventListener("click", function () {
      window.close();
      setTimeout(function () {
        $("close-hint").hidden = false;
      }, 300);
    });
    $("btn-done-again").addEventListener("click", function () {
      showView("select");
    });
    $("member-search").addEventListener("input", function (ev) {
      state.memberQuery = ev.target.value;
      renderMemberSelect();
    });
    $("chosung-chips").addEventListener("click", function (ev) {
      var chip = ev.target.closest("[data-initial]");
      if (!chip) return;
      state.memberInitial = chip.getAttribute("data-initial");
      renderMemberSelect();
    });
    initMembers();
  });
})();

</script>
</body>
</html>
