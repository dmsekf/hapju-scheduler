<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4b90e2" />
    <title>관리자 - 합주 스케줄러</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
:root {
  --bg: #f4f8ff;
  --paper: #ffffff;
  --ink: #243044;
  --muted: #5d6f86;
  --line: #d5e4f4;
  --navy: #4b90e2;
  --navy-2: #3b7ed0;
  --coral: #ff7a72;
  --coral-soft: #ffe4e1;
  --ok: #3da87a;
  --header-fg: #ffffff;
  --grid-head: #eaf3ff;
  --grid-time: #f3f8ff;
  --shadow: 0 8px 24px rgba(75, 144, 226, 0.12);
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
}

body {
  padding-bottom: var(--safe-bottom);
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden,
[hidden] {
  display: none !important;
}

.topbar,
.schedule-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: var(--navy);
  color: var(--header-fg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border: 2px solid var(--header-fg);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.logo-mark i {
  border: 1px solid rgba(247, 241, 232, 0.4);
}

.logo-mark i:nth-child(1),
.logo-mark i:nth-child(4) {
  background: var(--coral);
}

.icon-btn,
.text-btn,
.primary,
.ghost {
  border: 0;
  border-radius: 10px;
  min-height: 44px;
}

.icon-btn,
.ghost {
  background: rgba(255, 255, 255, 0.08);
  color: inherit;
  padding: 0 12px;
}

.text-btn {
  background: transparent;
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.primary {
  background: var(--navy);
  color: #fff;
  padding: 0 18px;
  font-weight: 700;
}

.primary:disabled {
  opacity: 0.6;
}

.ghost.light {
  background: #e8f2ff;
  color: var(--ink);
}

.select-wrap {
  min-height: calc(100dvh - 56px);
  display: grid;
  place-items: start center;
  padding: 28px 16px 40px;
}

.card {
  width: min(560px, 100%);
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 22px;
  box-shadow: var(--shadow);
}

.card h1 {
  margin: 0 0 8px;
  font-size: 1.6rem;
}

.lead {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 0.95rem;
}

.member-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  max-height: min(46vh, 420px);
  overflow: auto;
  padding-right: 2px;
}

.member-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  text-align: center;
  font-weight: 600;
  font-size: 0.92rem;
}

.member-btn small {
  font-weight: 500;
  color: var(--muted);
}

.member-btn.is-last,
.member-btn:hover {
  border-color: var(--navy);
}

.resume-btn {
  width: 100%;
  margin-bottom: 14px;
  background: var(--navy);
  color: #fff;
  border: 0;
  border-radius: 12px;
  min-height: 48px;
  font-weight: 700;
}

.connect-status,
.empty-hint {
  color: var(--muted);
  font-size: 0.88rem;
}

.settings-toggle {
  margin-top: 18px;
  background: none;
  border: 0;
  color: var(--muted);
  text-decoration: underline;
  padding: 0;
}

.settings-panel {
  margin-top: 12px;
  display: grid;
  gap: 8px;
}

.settings-panel input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  background: #fff;
}

.who {
  min-width: 0;
}

.who strong {
  display: block;
  font-size: 1.05rem;
}

.who p {
  margin: 2px 0 0;
  font-size: 0.75rem;
  opacity: 0.8;
}

.week-bar {
  position: sticky;
  top: 56px;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 16px;
  background: var(--bg);
}

.week-bar strong {
  font-size: 0.95rem;
}

.layout {
  display: grid;
  gap: 16px;
  padding: 0 16px 32px;
}

.panel {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 1rem;
}

.day-chips {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}

.day-chip {
  display: grid;
  justify-items: center;
  gap: 2px;
  min-height: 58px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 6px 0;
}

.day-chip span {
  font-size: 0.72rem;
  color: var(--muted);
}

.day-chip strong {
  font-size: 1rem;
}

.day-chip em {
  font-style: normal;
  font-size: 0.68rem;
  color: var(--coral);
}

.day-chip.is-active {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.day-chip.is-active span,
.day-chip.is-active em {
  color: #f8d7d4;
}

.day-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.day-actions button {
  flex: 1;
}

.hour-list {
  display: grid;
  gap: 8px;
  user-select: none;
}

.hour-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.hour-btn b {
  font-weight: 600;
  color: var(--ok);
  font-size: 0.82rem;
}

.hour-btn.is-off,
td.is-off {
  background: var(--coral);
  color: #fff;
  border-color: #f06a62;
}

.hour-btn.is-off b {
  color: #fff;
}

.grid-hint {
  margin: 0 0 10px;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.45;
}

.grid-wrap {
  overflow: visible;
  max-height: none;
  border: 1px solid var(--line);
  border-radius: 12px;
  user-select: none;
}

table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
}

th,
td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: center;
  height: 36px;
}

td {
  touch-action: manipulation;
}

thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: var(--grid-head);
  font-size: 0.82rem;
}

tbody th {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 64px;
  background: var(--grid-time);
  font-size: 0.78rem;
  color: var(--muted);
}

thead th:first-child {
  left: 0;
  z-index: 4;
}

thead th span {
  display: block;
  color: var(--muted);
  font-weight: 500;
  font-size: 0.72rem;
}

td {
  background: #fff;
  cursor: pointer;
}

.reason-row {
  display: grid;
  gap: 8px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.reason-meta {
  display: grid;
}

.reason-meta small {
  color: var(--muted);
}

.reason-row input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
}

.sync-label {
  margin: 0 0 10px;
  font-size: 0.8rem;
  color: var(--muted);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-bottom));
  transform: translateX(-50%) translateY(12px);
  background: var(--navy-2);
  color: #fff;
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 0.85rem;
  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
  z-index: 40;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.warn {
  background: #8a3b34;
}

@media (min-width: 900px) {
  .layout {
    grid-template-columns: 1.4fr 0.8fr;
    padding-bottom: 32px;
  }

  .grid-hint {
    display: none;
  }

  .grid-wrap {
    overflow: auto;
    max-height: min(68vh, 720px);
  }

  th,
  td {
    height: 40px;
  }

  .schedule-header .primary {
    min-width: 96px;
  }

  .header-save {
    display: block;
  }
}

@media (max-width: 899px) {
  .schedule-header .header-save {
    display: block;
    min-width: 72px;
    flex-shrink: 0;
  }

  .layout {
    padding: 0 10px 32px;
  }

  .schedule-header {
    padding: 10px 12px;
  }

  .week-bar {
    top: 52px;
    padding: 8px 10px;
  }

  .grid-wrap {
    overflow: visible;
    max-height: none;
  }

  thead th,
  tbody th,
  thead th:first-child {
    position: static;
  }

  .panel {
    padding: 12px 10px;
  }

  table {
    min-width: 0;
    table-layout: fixed;
  }

  tbody th,
  thead th:first-child {
    width: 42px;
    font-size: 0.68rem;
    padding: 0 2px;
  }

  thead th {
    font-size: 0.68rem;
    padding: 4px 1px;
  }

  thead th span {
    font-size: 0.62rem;
  }

  td {
    height: 34px;
  }
}

.search-row {
  margin-bottom: 10px;
}

.search-row input {
  width: 100%;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  background: #fff;
}

.chosung-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.chip,
.admin-tabs button {
  min-height: 34px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--ink);
  font-size: 0.82rem;
}

.chip.is-on,
.admin-tabs button.is-on {
  background: var(--navy);
  color: #fff;
  border-color: var(--navy);
}

.member-count {
  margin: 8px 0 0;
  font-size: 0.8rem;
  color: var(--muted);
}

.admin-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.admin-gate {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}

.admin-page {
  padding: 0 16px 28px;
}

.admin-tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px 12px;
}

.heat-cell {
  cursor: pointer;
  font-weight: 700;
  font-size: 0.82rem;
}

.heat-good {
  background: #d7efe0;
}

.heat-ok {
  background: #f4e7c3;
}

.heat-bad {
  background: #f4d0cc;
}

.status-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.status-row .ok {
  color: var(--ok);
  font-size: 0.85rem;
}

.status-row .wait {
  color: var(--coral);
  font-size: 0.85rem;
}

#admin-roster {
  width: 100%;
  min-height: 220px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  font: inherit;
}

.admin-detail {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
}

.detail-cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.detail-cols h3 {
  margin: 0 0 6px;
  font-size: 0.85rem;
}

.admin-badge {
  font-size: 0.75rem;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
}

.menu-split {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0 16px;
}

.subhead {
  font-size: 1rem;
  margin: 0 0 10px;
}

.menu-actions {
  display: grid;
  gap: 10px;
  margin-top: 18px;
}

.menu-actions .primary,
.menu-actions .ghost.light {
  width: 100%;
}

.upload-box {
  text-align: center;
}

.upload-box .warn {
  color: var(--coral);
  font-weight: 700;
}

.file-btn {
  display: inline-block;
  margin-top: 12px;
}

.song-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 16px 12px;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 12px 16px;
}

.match-modes {
  display: flex;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}

.match-modes .chip {
  border: 0;
  border-radius: 0;
  appearance: none;
  -webkit-appearance: none;
}

.match-modes .chip + .chip {
  border-left: 1px solid var(--line);
}

.match-modes .chip::after,
.match-modes .chip::before {
  content: none;
}

#layout-modes {
  margin-left: auto;
}

.hour-range {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--muted);
}

.hour-range select {
  min-height: 40px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 8px;
  background: #fff;
  color: var(--ink);
}

.legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 10px;
  font-size: 0.8rem;
  color: var(--muted);
}

.legend-dot {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.legend-dot i {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid var(--line);
}

.legend-dot.free i {
  background: #fff6c8;
}

.legend-dot.busy i {
  background: #f6d4d1;
}

.legend-dot.open i {
  background: #fff;
}

td.cell-free {
  background: #ffe566;
  cursor: pointer;
}

td.cell-open {
  background: #fff;
  cursor: pointer;
}

td.cell-busy {
  background: var(--coral);
  color: #fff;
  cursor: pointer;
  font-size: 0.62rem;
  font-weight: 700;
  line-height: 1.2;
  padding: 3px 2px;
  vertical-align: middle;
  white-space: normal;
}

.song-board .legend-dot.free i {
  background: #ffe566;
}

.song-board .legend-dot.busy i {
  background: var(--coral);
}

.cell-pos {
  display: block;
}

#admin-day-grid {
  width: max-content;
  min-width: 100%;
  table-layout: auto;
  border-collapse: collapse;
  background: #fff;
}

#admin-day-grid thead th {
  background: #f3f3f3;
  color: #333;
  font-size: 0.82rem;
  font-weight: 600;
}

#admin-day-grid thead th.song-col {
  background: #f3f3f3;
  font-size: 0.78rem;
  font-weight: 600;
  color: #333;
  min-width: 96px;
  max-width: 120px;
  white-space: normal;
  word-break: keep-all;
  line-height: 1.25;
  height: auto;
  padding: 8px 6px;
}

#admin-day-grid thead th:first-child,
#admin-day-grid tbody th {
  position: sticky;
  left: 0;
  z-index: 2;
  width: 52px;
  min-width: 52px;
  font-size: 0.8rem;
  background: #fafafa;
  color: #666;
}

#admin-day-grid thead th:first-child {
  background: #f3f3f3;
}

#admin-day-grid th,
#admin-day-grid td {
  min-width: 96px;
  height: 44px;
  padding: 6px 4px;
  border: 1px solid #e6e6e6;
  text-align: center;
}

#admin-day-grid td.cell-free {
  background: #fff6c8;
}

#admin-day-grid td.cell-busy {
  background: #f6d4d1;
  color: #9a4440;
  font-weight: 700;
  font-size: 0.68rem;
  line-height: 1.25;
  height: auto;
  min-height: 44px;
  vertical-align: middle;
}

#admin-day-grid td.cell-active {
  outline: 2px solid #4b90e2;
  outline-offset: -2px;
}

.day-grid-wrap {
  overflow: auto;
  max-width: 100%;
}

.slot-detail {
  border: 1px solid #ececec;
  border-radius: 16px;
  padding: 20px;
  background: #fff;
  min-height: 160px;
}

.detail-title {
  margin: 0 0 8px;
  font-size: 1.05rem;
  font-weight: 700;
  color: #1c1c1c;
}

.busy-count {
  margin: 0 0 12px;
  color: #e24b4b;
  font-weight: 700;
}

.detail-line {
  border: 0;
  border-top: 1px solid #ececec;
  margin: 0 0 14px;
}

.detail-person {
  margin: 0 0 8px;
  font-size: 0.95rem;
  color: #222;
}

.day-title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.day-mode-label {
  font-weight: 700;
}

.date-picker-wrap {
  position: relative;
  z-index: 12;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.date-picker-btn {
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 0 12px;
  border: 1px solid #d8d8d8;
  border-radius: 8px;
  background: #fff;
  color: #222;
  font-weight: 700;
}

.date-step {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  font-weight: 700;
}

.cal-box.cal-pop {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  z-index: 30;
  width: 292px;
  box-shadow: 0 10px 28px rgba(36, 48, 68, 0.16);
}

.cal-box {
  background: #fff;
  border: 1px solid #e6e6e6;
  border-radius: 10px;
  padding: 14px 14px 12px;
  max-width: 292px;
}

.cal-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
}

.cal-nav strong {
  font-size: 0.95rem;
  font-weight: 700;
  color: #222;
}

.cal-nav-btn {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  background: transparent;
  color: #666;
  font-size: 1.25rem;
  line-height: 1;
}

.cal-weekdays,
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-weekdays {
  margin-bottom: 4px;
  text-align: center;
  font-size: 0.72rem;
  color: #9aa3ad;
  font-weight: 600;
}

.cal-day {
  width: 34px;
  height: 34px;
  min-height: 34px;
  margin: 1px auto;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #222;
  font-size: 0.82rem;
  font-weight: 600;
}

.cal-day.is-out {
  color: #c5c9ce;
  opacity: 1;
}

.cal-day.is-today:not(.is-on) {
  box-shadow: inset 0 0 0 1px #4b90e2;
}

.cal-day.is-on {
  background: #4b90e2;
  color: #fff;
}

@media (min-width: 900px) {
  .day-board .admin-match {
    grid-template-columns: minmax(0, 1fr) 260px;
  }

  }

  function memberBusyAt(name, dateStr, hour) {
    var map = db.unavailabilities[name];
    if (!map) return null;
    var key = dateStr + "_" + hour;
    if (map[key] === undefined) return null;
    return map[key] || "사유 없음";
  }

  function memberWeekSummary(name) {
    var map = db.unavailabilities[name] || {};
    var dates = weekDates();
    var rows = [];
    dates.forEach(function (d) {
      var dateStr = formatDateStr(d);
      var byReason = {};
      for (var h = state.hourStart; h <= state.hourEnd; h++) {
        if (map[dateStr + "_" + h] === undefined) continue;
        var reason = map[dateStr + "_" + h] || "사유 없음";
        if (!byReason[reason]) byReason[reason] = [];
        byReason[reason].push(h);
      }
      Object.keys(byReason).forEach(function (reason) {
        rows.push({
          dateStr: dateStr,
          hours: hourRanges(byReason[reason]),
          reason: reason,
        });
      });
    });
    return rows;
  }

  function sessionsForName(rows, name) {
    var list = [];
    (rows || []).forEach(function (row) {
      if (row.name === name && row.session && list.indexOf(row.session) < 0) list.push(row.session);
    });
    return list;
  }

  function busySessionLabels(rows, busy) {
    var labels = [];
    (busy || []).forEach(function (person) {
      var sess = sessionsForName(rows, person.name);
      if (!sess.length) {
        if (labels.indexOf(person.name) < 0) labels.push(person.name);
        return;
      }
      sess.forEach(function (s) {
        if (labels.indexOf(s) < 0) labels.push(s);
      });
    });
    return labels;
  }

  function busyPeople(names, dateStr, hour) {
    var key = dateStr + "_" + hour;
    var list = [];
    names.forEach(function (name) {
      var map = db.unavailabilities[name];
      if (map && map[key] !== undefined) {
        list.push({ name: name, reason: map[key] || "사유 없음" });
      }
    });
    return list;
  }

  function renderWeekLabel() {
    var start = state.monday;
    var end = addDays(state.monday, 6);
    $("admin-week-label").textContent =
      start.getMonth() +
      1 +
      "/" +
      start.getDate() +
      "(" +
      DAYS[start.getDay()] +
      ") – " +
      (end.getMonth() + 1) +
      "/" +
      end.getDate() +
      "(" +
      DAYS[end.getDay()] +
      ")";
  }

  function renderModes() {
    var buttons = document.querySelectorAll("#match-modes [data-mode]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("is-on", buttons[i].getAttribute("data-mode") === state.mode);
    }
  }

  function renderDetail() {
    var box = $("slot-detail");
    if (!box) return;
    if (state.viewMember) {
      var name = state.viewMember;
      if (!memberEntered(name)) {
        box.innerHTML =
          "<h3>" +
          escapeHtml(name) +
          "</h3><p class=\"empty-hint\">아직 불가능한 시간을 제출하지 않았습니다.</p>";
        return;
      }
      var summary = memberWeekSummary(name);
      if (state.detail) {
        var reason = memberBusyAt(name, state.detail.dateStr, state.detail.hour);
        var title = prettyDate(state.detail.dateStr) + " " + state.detail.hour + ":00";
        box.innerHTML =
          "<h3>" +
          escapeHtml(name) +
          "</h3><p><strong>" +
          escapeHtml(title) +
          "</strong> · " +
          (reason ? "불가 · " + escapeHtml(reason) : "가능") +
          "</p>" +
          (summary.length
            ? "<ul>" +
              summary
                .map(function (row) {
                  return (
                    "<li><span class=\"busy-name\">" +
                    escapeHtml(prettyDate(row.dateStr)) +
                    "</span> " +
                    escapeHtml(row.hours) +
                    " · <span class=\"busy-reason\">" +
                    escapeHtml(row.reason) +
                    "</span></li>"
                  );
                })
                .join("") +
              "</ul>"
            : "<p class=\"empty-hint\">이번 주 선택한 시간대에는 불가 입력이 없습니다.</p>");
        return;
      }
      if (!summary.length) {
        box.innerHTML =
          "<h3>" +
          escapeHtml(name) +
          "</h3><p class=\"empty-hint\">이번 주 선택한 시간대에는 불가 입력이 없습니다. 빨간 칸이 있으면 눌러 보세요.</p>";
        return;
      }
      box.innerHTML =
        "<h3>" +
        escapeHtml(name) +
        " · 이번 주 불가</h3><ul>" +
        summary
          .map(function (row) {
            return (
              "<li><span class=\"busy-name\">" +
              escapeHtml(prettyDate(row.dateStr)) +
              "</span> " +
              escapeHtml(row.hours) +
              " · <span class=\"busy-reason\">" +
              escapeHtml(row.reason) +
              "</span></li>"
            );
          })
          .join("") +
        "</ul>";
      return;
    }
    if (!state.detail) {
      if (state.layout === "day") {
        box.innerHTML =
          "<p class=\"detail-title\">상세 정보</p><p class=\"empty-hint\">불가능 칸을 누르면 누가 불가한지와 사유가 나타납니다.</p>";
      } else {
        box.innerHTML =
          "<h3>상세 정보</h3><p class=\"empty-hint\">빨간 칸(불가능)을 누르면 그 시간에 누가 불가한지와 사유가 나타납니다. 멤버 이름을 누르면 그 사람 시간표만 볼 수 있습니다.</p>";
      }
      return;
    }
    var info = state.detail;
    var title = prettyDate(info.dateStr) + " " + info.hour + ":00";
    if (info.song) title = info.song + " · " + title;
    if (state.layout === "day") {
      if (!info.busy.length) {
        box.innerHTML =
          "<p class=\"detail-title\">" +
          escapeHtml(title) +
          "</p><p>이 시간은 합주 가능합니다.</p>";
        return;
      }
      box.innerHTML =
        "<p class=\"detail-title\">" +
        escapeHtml(title) +
        "</p><p class=\"busy-count\">불가능한 멤버 " +
        info.busy.length +
        "명</p><hr class=\"detail-line\" />" +
        info.busy
          .map(function (row) {
            return (
              "<p class=\"detail-person\">" +
              escapeHtml(row.name) +
              " · " +
              escapeHtml(row.reason) +
              "</p>"
            );
          })
          .join("");
      return;
    }
    var rows = info.song ? membersForSong(info.song).rows : currentMembers().rows;
    if (!info.busy.length) {
      box.innerHTML =
        "<h3>상세 정보</h3><p><strong>" +
        escapeHtml(title) +
        "</strong></p><p>이 시간은 <strong>합주 가능</strong>합니다.</p>";
      return;
    }
    box.innerHTML =
      "<h3>상세 정보</h3><p><strong>" +
      escapeHtml(title) +
      "</strong></p><p class=\"busy-count\">불가능한 멤버 " +
      info.busy.length +
      "명</p><ul>" +
      info.busy
        .map(function (row) {
          var sess = sessionsForName(rows, row.name);
          var pos = sess.length ? " (" + sess.join(", ") + ")" : "";
          return (
            "<li><span class=\"busy-name\">" +
            escapeHtml(row.name) +
            escapeHtml(pos) +
            "</span> · <span class=\"busy-reason\">" +
            escapeHtml(row.reason) +
            "</span></li>"
          );
        })
        .join("") +
      "</ul>";
    return;
  }

  function renderLayouts() {
    var buttons = document.querySelectorAll("#layout-modes [data-layout]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("is-on", buttons[i].getAttribute("data-layout") === state.layout);
    }
    if ($("admin-week-bar")) $("admin-week-bar").hidden = state.layout === "day";
  }

  function calendarHtml() {
    var year = state.calMonth.getFullYear();
    var month = state.calMonth.getMonth();
    var today = new Date();
    var first = new Date(year, month, 1, 12, 0, 0);
    var start = getMonday(first);
    var weekdays = ["월", "화", "수", "목", "금", "토", "일"]
      .map(function (d) {
        return "<span>" + d + "</span>";
      })
      .join("");
    var days = "";
    for (var i = 0; i < 42; i++) {
      var d = addDays(start, i);
      var outside = d.getMonth() !== month;
      var cls = "cal-day";
      if (outside) cls += " is-out";
      if (sameDate(d, state.selectedDate)) cls += " is-on";
      if (sameDate(d, today)) cls += " is-today";
      days +=
        '<button type="button" class="' +
        cls +
        '" data-cal-date="' +
        formatDateStr(d) +
        '">' +
        d.getDate() +
        "</button>";
    }
    return (
      '<div class="cal-box cal-pop"><div class="cal-nav"><button type="button" class="cal-nav-btn" data-cal-month="-1" aria-label="이전 달">‹</button><strong>' +
      year +
      "년 " +
      (month + 1) +
      '월</strong><button type="button" class="cal-nav-btn" data-cal-month="1" aria-label="다음 달">›</button></div><div class="cal-weekdays">' +
      weekdays +
      '</div><div class="cal-grid">' +
      days +
      "</div></div>"
    );
  }

  function renderDayBoard() {
    var songs = HapjuMatch.songList(db.parsedData);
    var tabs = $("song-tabs");
    var box = $("song-results");
    tabs.hidden = true;
    tabs.innerHTML = "";
    if (!songs.length) {
      box.innerHTML = '<div class="panel"><p class="empty-hint">업로드된 명단이 없습니다. 엑셀을 먼저 올려 주세요.</p></div>';
      return;
    }
    var day = state.selectedDate;
    var dateStr = formatDateStr(day);
    var active = state.detail;
    var head = '<tr><th>시간</th>';
    songs.forEach(function (s) {
      head += '<th class="song-col">' + escapeHtml(s) + "</th>";
    });
    var body = "";
    for (var h = state.hourStart; h <= state.hourEnd; h++) {
      body += "<tr><th>" + h + ":00</th>";
      songs.forEach(function (s) {
        var target = membersForSong(s);
        var busy = busyPeople(target.names, dateStr, h);
        var free = !busy.length && target.names.length;
        var inner = "";
        if (!free) {
          var labels = busySessionLabels(target.rows, busy);
          if (!labels.length) inner = '<span class="cell-pos">불가능</span>';
          else {
            inner = labels
              .map(function (label) {
                return '<span class="cell-pos">' + escapeHtml(label) + "</span>";
              })
              .join("");
          }
        }
        var selected =
          active && active.song === s && active.dateStr === dateStr && Number(active.hour) === h
            ? " cell-active"
            : "";
        body +=
          '<td class="' +
          (free ? "cell-free" : "cell-busy") +
          selected +
          '" data-date="' +
          dateStr +
          '" data-hour="' +
          h +
          '" data-song="' +
          escapeHtml(s) +
          '">' +
          inner +
          "</td>";
      });
      body += "</tr>";
    }
    var modeLabel = state.mode === "inst" ? "보컬 제외" : "완전체";
    box.innerHTML =
      '<section class="panel day-board"><h2 class="day-title-row"><span class="date-picker-wrap"><button type="button" class="date-step" data-day-step="-1" aria-label="이전 날">◀</button><button type="button" class="date-picker-btn" data-cal-toggle="1">' +
      escapeHtml(prettyDate(dateStr)) +
      ' ▾</button><button type="button" class="date-step" data-day-step="1" aria-label="다음 날">▶</button>' +
      (state.calOpen ? calendarHtml() : "") +
      "</span><span class=\"day-mode-label\"> · " +
      modeLabel +
      '</span></h2><p class="legend-row"><span class="legend-dot free"><i></i>가능</span><span class="legend-dot busy"><i></i>불가능</span></p><div class="admin-match"><div class="grid-wrap day-grid-wrap"><table id="admin-day-grid"><thead>' +
      head +
      "</tr></thead><tbody>" +
      body +
      '</tbody></table></div><div id="slot-detail" class="slot-detail"></div></div></section>';
    renderDetail();
  }

  function renderResults() {
    var songs = HapjuMatch.songList(db.parsedData);
    var tabs = $("song-tabs");
    var box = $("song-results");
    renderWeekLabel();
    renderModes();
    renderLayouts();
    if (!songs.length) {
      tabs.hidden = false;
      tabs.innerHTML = "";
      box.innerHTML = '<div class="panel"><p class="empty-hint">업로드된 명단이 없습니다. 엑셀을 먼저 올려 주세요.</p></div>';
      return;
    }
    if (state.layout === "day") {
      renderDayBoard();
      return;
    }
    tabs.hidden = false;
    if (!state.selectedSong || songs.indexOf(state.selectedSong) < 0) state.selectedSong = songs[0];
    tabs.innerHTML = songs
      .map(function (s) {
        return (
          '<button type="button" class="chip' +
          (s === state.selectedSong ? " is-on" : "") +
          '" data-song="' +
          escapeHtml(s) +
          '">' +
          escapeHtml(s) +
          "</button>"
        );
      })
      .join("");

    var song = state.selectedSong;
    var sData = HapjuMatch.songMembers(db.parsedData, song);
    var target = currentMembers();
    var tags =
      '<button type="button" class="tag tag-all' +
      (state.viewMember ? "" : " is-on") +
      '" data-member="">전체</button>' +
      sData
        .map(function (row) {
          var entered = memberEntered(row.name);
          var inMode = target.names.indexOf(row.name) >= 0;
          var cls = !entered ? "tag-miss" : HapjuMatch.isVocal(row.session) ? "tag-vocal" : "tag-ok";
          var on = state.viewMember === row.name ? " is-on" : "";
          return (
            '<button type="button" class="tag ' +
            cls +
            (inMode ? "" : " tag-dim") +
            on +
            '" data-member="' +
            escapeHtml(row.name) +
            '">' +
            escapeHtml(row.name) +
            "(" +
            escapeHtml(row.session) +
            ")" +
            (entered ? "" : " 미입력") +
            "</button>"
          );
        })
        .join("");

    if (!target.names.length) {
      box.innerHTML =
        '<section class="panel"><h2>' +
        escapeHtml(song) +
        '</h2><div class="need-row"><span class="need-label">멤버를 누르면 그 사람 시간표</span>' +
        tags +
        '</div><p class="empty-hint">이 기준에 해당하는 멤버가 없습니다.</p></section>';
      return;
    }

    var dates = weekDates();
    var active = state.detail;
    var head = "<tr><th>시간</th>";
    dates.forEach(function (d) {
      head += "<th><span>" + (d.getMonth() + 1) + "/" + d.getDate() + "</span>" + DAYS[d.getDay()] + "</th>";
    });
    var body = "";
    for (var h = state.hourStart; h <= state.hourEnd; h++) {
      body += "<tr><th>" + h + ":00</th>";
      dates.forEach(function (d) {
        var dateStr = formatDateStr(d);
        var inner = "";
        var cls = "cell-free";
        var busy;
        if (state.viewMember) {
          var reason = memberBusyAt(state.viewMember, dateStr, h);
          cls = reason ? "cell-busy" : "cell-open";
        } else {
          busy = busyPeople(target.names, dateStr, h);
          cls = !busy.length && target.names.length ? "cell-free" : "cell-busy";
          if (busy.length) {
            inner = busySessionLabels(target.rows, busy)
              .map(function (label) {
                return '<span class="cell-pos">' + escapeHtml(label) + "</span>";
              })
              .join("");
          }
        }
        var selected =
          active && active.dateStr === dateStr && Number(active.hour) === h ? " cell-active" : "";
        body +=
          '<td class="' +
          cls +
          selected +
          '" data-date="' +
          dateStr +
          '" data-hour="' +
          h +
          '">' +
          inner +
          "</td>";
      });
      body += "</tr>";
    }

    var modeLabel = state.viewMember
      ? state.viewMember
      : state.mode === "inst"
        ? "보컬 제외 기악"
        : "완전체";
    var legend = state.viewMember
      ? '<span class="legend-dot busy"><i></i>이 멤버 불가</span><span class="legend-dot open"><i></i>가능 / 미표시</span>'
      : '<span class="legend-dot free"><i></i>합주 가능</span><span class="legend-dot busy"><i></i>누군가 불가</span>';
    box.innerHTML =
      '<section class="panel song-board"><h2>' +
      escapeHtml(song) +
      " · " +
      modeLabel +
      '</h2><div class="need-row"><span class="need-label">멤버를 누르면 그 사람 시간표</span>' +
      tags +
      '</div><p class="legend-row">' +
      legend +
      '</p><div class="admin-match"><div class="grid-wrap"><table id="admin-grid"><thead>' +
      head +
      "</tr></thead><tbody>" +
      body +
      '</tbody></table></div><div id="slot-detail" class="slot-detail"></div></div></section>';
    renderDetail();
  }

  function parseExcel(file) {
    var reader = new FileReader();
    reader.onload = function (event) {
      var data = new Uint8Array(event.target.result);
      var workbook = XLSX.read(data, { type: "array" });
      var json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
      if (!json || json.length < 2) {
        showToast("데이터가 부족합니다.");
        return;
      }
      var parsed = [];
      var names = {};
      for (var i = 1; i < json.length; i++) {
        var row = json[i];
        if (!row || !row[0]) continue;
        var song = String(row[0]).trim();
        var session = String(row[1] || "").trim();
        var name = String(row[2] || "").trim();
        if (song && name) {
          parsed.push({ song: song, session: session, name: name });
          names[name] = true;
        }
      }
      if (!parsed.length) {
        showToast("유효한 데이터가 없습니다.");
        return;
      }
      db.parsedData = parsed;
      db.members = Object.keys(names).sort(function (a, b) {
        return a.localeCompare(b, "ko");
      });
      db.unavailabilities = {};
      HapjuSync.save(db)
        .then(function (result) {
          if (result && result.localOnly) {
            showToast("이 컴퓨터에만 저장됐습니다. Netlify 사이트 주소의 관리자 페이지에서 다시 올려 주세요.");
            return;
          }
          showToast("서버에 명단을 올렸습니다. 휴대폰에서도 같은 주소로 열면 보입니다.");
          showView("menu");
        })
        .catch(function (err) {
          showToast((err && err.message) || "서버 저장에 실패했습니다. 파일을 다시 올려 주세요.");
        });
    };
    reader.readAsArrayBuffer(file);
  }

  function goMember() {
    window.location.href = "index.html";
  }

  function fillHourSelects() {
    var startSel = $("hour-start");
    var endSel = $("hour-end");
    var html = "";
    for (var h = START; h <= END; h++) {
      html += '<option value="' + h + '">' + h + ":00</option>";
    }
    startSel.innerHTML = html;
    endSel.innerHTML = html;
    startSel.value = String(state.hourStart);
    endSel.value = String(state.hourEnd);
  }

  function applyHourRange() {
    var start = Number($("hour-start").value);
    var end = Number($("hour-end").value);
    if (start > end) {
      var swap = start;
      start = end;
      end = swap;
      $("hour-start").value = String(start);
      $("hour-end").value = String(end);
    }
    state.hourStart = start;
    state.hourEnd = end;
    state.detail = null;
    renderResults();
  }

  document.addEventListener("DOMContentLoaded", function () {
    fillHourSelects();
    $("hour-start").addEventListener("change", applyHourRange);
    $("hour-end").addEventListener("change", applyHourRange);
    $("admin-pw").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") checkAuth();
    });
    $("btn-login").addEventListener("click", checkAuth);
    $("btn-results").addEventListener("click", function () {
      HapjuSync.load().then(function (data) {
        db = data;
        state.detail = null;
        showView("results");
      });
    });
    $("btn-upload").addEventListener("click", function () {
      showView("upload");
    });
    $("btn-back-menu").addEventListener("click", function () {
      showView("menu");
    });
    $("btn-back-menu-2").addEventListener("click", function () {
      showView("menu");
    });
    $("btn-member").addEventListener("click", goMember);
    $("btn-change-pin").addEventListener("click", function () {
      var oldPin = $("pin-old").value;
      var newPin = $("pin-new").value.trim();
      if (newPin.length < 4) {
        showToast("새 비밀번호는 4자 이상이어야 합니다.");
        return;
      }
      HapjuSync.changePin(oldPin, newPin)
        .then(function () {
          $("pin-old").value = "";
          $("pin-new").value = "";
          showToast("비밀번호를 바꿨습니다.");
        })
        .catch(function (err) {
          showToast((err && err.message) || "비밀번호를 바꾸지 못했습니다.");
        });
    });
    $("file-upload").addEventListener("change", function (ev) {
      if (ev.target.files && ev.target.files[0]) parseExcel(ev.target.files[0]);
    });
    $("admin-week-prev").addEventListener("click", function () {
      state.monday = addDays(state.monday, -7);
      state.detail = null;
      renderResults();
    });
    $("admin-week-next").addEventListener("click", function () {
      state.monday = addDays(state.monday, 7);
      state.detail = null;
      renderResults();
    });
    $("layout-modes").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-layout]");
      if (!btn) return;
      state.layout = btn.getAttribute("data-layout");
      state.detail = null;
      state.viewMember = null;
      renderResults();
    });
    $("match-modes").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-mode]");
      if (!btn) return;
      state.mode = btn.getAttribute("data-mode");
      state.detail = null;
      renderResults();
    });
    $("song-tabs").addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-song]");
      if (!btn) return;
      state.selectedSong = btn.getAttribute("data-song");
      state.detail = null;
      state.viewMember = null;
      renderResults();
    });
    $("song-results").addEventListener("click", function (ev) {
      var toggle = ev.target.closest("[data-cal-toggle]");
      if (toggle) {
        state.calOpen = !state.calOpen;
        if (state.calOpen) {
          state.calMonth = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12, 0, 0);
        }
        renderResults();
        return;
      }
      var dayStep = ev.target.closest("[data-day-step]");
      if (dayStep) {
        state.selectedDate = addDays(state.selectedDate, Number(dayStep.getAttribute("data-day-step")));
        state.calMonth = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12, 0, 0);
        state.monday = getMonday(state.selectedDate);
        state.detail = null;
        state.calOpen = false;
        renderResults();
        return;
      }
      var calMonth = ev.target.closest("[data-cal-month]");
      if (calMonth) {
        var delta = Number(calMonth.getAttribute("data-cal-month"));
        state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + delta, 1, 12, 0, 0);
        renderResults();
        return;
      }
      var calDay = ev.target.closest("[data-cal-date]");
      if (calDay) {
        state.selectedDate = parseDateStr(calDay.getAttribute("data-cal-date"));
        state.calMonth = new Date(state.selectedDate.getFullYear(), state.selectedDate.getMonth(), 1, 12, 0, 0);
        state.monday = getMonday(state.selectedDate);
        state.detail = null;
        state.calOpen = false;
        renderResults();
        return;
      }
      if (state.calOpen && !ev.target.closest(".date-picker-wrap")) {
        state.calOpen = false;
        renderResults();
      }
      var dayChip = ev.target.closest("[data-day-index]");
      if (dayChip) {
        state.selectedDayIndex = Number(dayChip.getAttribute("data-day-index"));
        state.detail = null;
        renderResults();
        return;
      }
      var tag = ev.target.closest("[data-member]");
      if (tag) {
        var name = tag.getAttribute("data-member") || "";
        state.viewMember = name || null;
        state.detail = null;
        renderResults();
        return;
      }
      var cell = ev.target.closest("td[data-date][data-hour]");
      if (!cell) return;
      var dateStr = cell.getAttribute("data-date");
      var hour = Number(cell.getAttribute("data-hour"));
      var song = cell.getAttribute("data-song");
      var names = song
        ? membersForSong(song).names
        : state.viewMember
          ? [state.viewMember]
          : currentMembers().names;
      state.detail = {
        dateStr: dateStr,
        hour: hour,
        song: song || "",
        busy: busyPeople(names, dateStr, hour),
      };
      renderResults();
    });
  });
})();
</script>
  </body>
</html>
